name: Server release container

on:
  push:
    branches:
      - release/amoria-1.0-server-rc
  pull_request:
    branches:
      - release/amoria-1.0-server-rc
  workflow_dispatch:

permissions:
  contents: read

jobs:
  canonical-dockerfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build canonical server image
        run: >-
          docker build
          --file Dockerfile
          --build-arg RELEASE_SHA="$GITHUB_SHA"
          --build-arg APP_VERSION=0.1.0-release-candidate
          --tag amoria-server-release-contract:$GITHUB_SHA
          .
