services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: amoria
      POSTGRES_USER: amoria
      POSTGRES_PASSWORD: amoria_password
    ports:
      - "5432:5432"
    volumes:
      - amoria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amoria -d amoria"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./server
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "4000:4000"
    volumes:
      - ./server/uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  amoria_postgres_data:
