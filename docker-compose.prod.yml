name: amoria-production

x-api-environment: &api-environment
  NODE_ENV: production
  DATABASE_URL: ${DATABASE_RUNTIME_URL:?DATABASE_RUNTIME_URL is required}
  TEXT_MODERATION_PYTHON: /usr/local/bin/python3
  TEXT_MODERATION_MODEL_DIR: /models/text
  RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA is required}
  APP_VERSION: ${APP_VERSION:-0.1.0}

x-container-hardening: &container-hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  init: true

x-production-logging: &production-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres@sha256:aefb61c5ac3326e56a7b769fa655fe00af0e335c1b9b65182bd6f6233dd12aad
    restart: unless-stopped
    environment:
      POSTGRES_DB: amoria
      POSTGRES_USER: amoria_migrator
      POSTGRES_PASSWORD: ${POSTGRES_MIGRATION_PASSWORD:?POSTGRES_MIGRATION_PASSWORD is required}
      POSTGRES_RUNTIME_PASSWORD: ${POSTGRES_RUNTIME_PASSWORD:?POSTGRES_RUNTIME_PASSWORD is required}
    volumes:
      - amoria_postgres_data:/var/lib/postgresql/data
      - ./scripts/postgres-init-runtime.sh:/docker-entrypoint-initdb.d/10-runtime-role.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amoria_migrator -d amoria"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    logging: *production-logging

  minio:
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    volumes:
      - amoria_minio_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
    <<: *container-hardening
    logging: *production-logging

  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?S3_ACCESS_KEY is required}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?S3_SECRET_KEY is required}
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 "$$S3_ACCESS_KEY" "$$S3_SECRET_KEY"
        mc mb --ignore-existing local/amoria
        mc anonymous set none local/amoria
    networks:
      - backend
    <<: *container-hardening

  migrate:
    image: ${API_IMAGE:?API_IMAGE is required}:${RELEASE_SHA:?RELEASE_SHA is required}
    build:
      context: .
      args:
        RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA is required}
        APP_VERSION: ${APP_VERSION:-0.1.0}
    restart: "no"
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      <<: *api-environment
      DATABASE_URL: ${DATABASE_MIGRATION_URL:?DATABASE_MIGRATION_URL is required}
    command: ["node", "scripts/run-db-migrate.mjs"]
    depends_on:
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    <<: *container-hardening

  api:
    image: ${API_IMAGE:?API_IMAGE is required}:${RELEASE_SHA:?RELEASE_SHA is required}
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      <<: *api-environment
    ports:
      - "127.0.0.1:${API_HOST_PORT:-4000}:4000"
    volumes:
      - ${TEXT_MODEL_HOST_DIR:?TEXT_MODEL_HOST_DIR is required}:/models/text:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - backend
      - ingress
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/health/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    <<: *container-hardening
    logging: *production-logging

  photo-worker:
    image: ${PHOTO_WORKER_IMAGE:?PHOTO_WORKER_IMAGE is required}:${RELEASE_SHA:?RELEASE_SHA is required}
    build:
      context: ./moderation-worker
    restart: unless-stopped
    env_file:
      - ${PRODUCTION_ENV_FILE:-.env.production}
    environment:
      DATABASE_URL: ${DATABASE_RUNTIME_URL:?DATABASE_RUNTIME_URL is required}
      OPENNSFW_ONNX_MODEL_PATH: /usr/local/lib/python3.13/site-packages/opennsfw_onnx/open-nsfw.onnx
      PERSON_YOLOX_ONNX_MODEL_PATH: /models/person/yolox_nano.onnx
      PERSON_YUNET_ONNX_MODEL_PATH: /models/person/face_detection_yunet_2023mar.onnx
      GRAPHIC_SAFETY_ONNX_MODEL_PATH: /models/graphic/image-safety-classifier-s.onnx
    volumes:
      - ${PERSON_MODEL_HOST_DIR:?PERSON_MODEL_HOST_DIR is required}:/models/person:ro
      - ${GRAPHIC_SAFETY_MODEL_HOST_DIR:?GRAPHIC_SAFETY_MODEL_HOST_DIR is required}:/models/graphic:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import pathlib; assert b'worker.py' in pathlib.Path('/proc/1/cmdline').read_bytes()"]
      interval: 30s
      timeout: 5s
      retries: 3
    <<: *container-hardening
    logging: *production-logging

networks:
  backend:
    internal: true
  ingress:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24
          gateway: 172.28.0.1

volumes:
  amoria_postgres_data:
  amoria_minio_data:
